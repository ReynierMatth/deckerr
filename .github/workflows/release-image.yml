name: Publish image

# Build the Docker image and push it to GHCR whenever a version tag is pushed
# (e.g. `git tag v1.0.0 && git push origin v1.0.0`) or a GitHub Release is
# published. The image is GENERIC — no Supabase config is baked in; each
# instance provides SUPABASE_URL / SUPABASE_ANON_KEY at runtime. So no secrets
# are needed here, and the published image is reusable by anyone.
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
