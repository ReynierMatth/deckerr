# Deckerr — static PWA served by nginx, behind Traefik.
# The image is generic (no Supabase config baked in): point it at YOUR Supabase
# at runtime via env vars. Put these in a .env next to this file:
#   SUPABASE_URL=https://<your-ref>.supabase.co
#   SUPABASE_ANON_KEY=<your anon key>      # public, protected by RLS
#   DECKERR_HOST=deckerr.your-domain.tld   # the host Traefik routes to
# then: docker compose pull && docker compose up -d
#
# To build locally instead of pulling from GHCR, replace `image:` with `build: .`

services:
  deckerr:
    image: ghcr.io/reyniermatth/deckerr:latest
    container_name: deckerr
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.deckerr.rule=(Host(`${DECKERR_HOST:-deckerr.example.com}`))
      - traefik.http.routers.deckerr.tls=true
      - traefik.http.routers.deckerr.tls.certresolver=myresolver
      - traefik.http.services.deckerr.loadbalancer.server.port=80
