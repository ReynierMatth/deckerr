# Deckerr — static PWA served by nginx, behind Traefik.
# Uses your external (cloud) Supabase: the URL + anon key are baked at BUILD
# time (Vite inlines VITE_* vars), so set them in a .env next to this file:
#   VITE_SUPABASE_URL=https://<ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY=<anon key>   # public, protected by RLS
#   DECKERR_HOST=deckerr.your-domain.tld # the host Traefik routes to
# then: docker compose up -d --build

services:
  deckerr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    image: deckerr:latest
    container_name: deckerr
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.deckerr.rule=(Host(`${DECKERR_HOST:-deckerr.example.com}`))
      - traefik.http.routers.deckerr.tls=true
      - traefik.http.routers.deckerr.tls.certresolver=myresolver
      - traefik.http.services.deckerr.loadbalancer.server.port=80
